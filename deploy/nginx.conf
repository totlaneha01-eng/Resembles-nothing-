# Reverse proxy for resembles.nothing — terminates TLS, forwards everything
# to the app container/process on 127.0.0.1:4000. src/index.js already does
# `app.set("trust proxy", 1)`, so it reads req.protocol correctly off the
# X-Forwarded-Proto header set below (this matters for Google OAuth's
# redirect_uri match in src/lib/googleCalendar.js, if that feature ever
# gets turned on).
#
# Install: copy this to /etc/nginx/sites-available/resemblesnothing.in,
# symlink it into sites-enabled, then run certbot (see DEPLOY.md) to fill
# in the ssl_certificate lines and the :80 -> :443 redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name resemblesnothing.in www.resemblesnothing.in;

    # certbot --nginx rewrites this block to redirect to https and adds the
    # 443 server block below with real certificate paths. Until then this
    # just proxies straight over HTTP so the site works during initial setup.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Body limit must be at least as large as express.json's 8mb (src/index.js)
    # — payment screenshots and design-submission images ride in the request
    # body as base64. nginx's own default (1m) would reject those before they
    # ever reach the app.
    client_max_body_size 10m;
}
