# Runs the app container only — Postgres stays on Supabase (DATABASE_URL/
# DIRECT_URL in .env point there), same database this app has always used.
# This isn't trying to replace that; it's just moving where the Node
# process itself runs, off Vercel and onto a server you control.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
